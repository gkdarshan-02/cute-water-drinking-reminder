<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>drink water, cheloo 💧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe3ec; --ink:#3b1f3a; --card:#fffaf3; --water:#6cc6ff; --water2:#9adcff;
  --butter:#ffe27a; --cherry:#ff5c8a; --mint:#b8f0d8; --lilac:#d9c7ff;
  --shadow:#3b1f3a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a1630;--ink:#ffe9f1;--card:#3f2447;--shadow:#12081a;}
}
:root[data-theme="dark"]{--bg:#2a1630;--ink:#ffe9f1;--card:#3f2447;--shadow:#12081a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;font-weight:600;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.55) 0 8%,transparent 9%),
                   radial-gradient(circle at 85% 30%,rgba(108,198,255,.35) 0 10%,transparent 11%),
                   radial-gradient(circle at 10% 80%,rgba(255,226,122,.4) 0 9%,transparent 10%);
  overflow-x:hidden;
}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float span{position:absolute;bottom:-40px;font-size:24px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 60px;text-align:center}
h1{font-family:'Bagel Fat One',cursive;font-weight:400;font-size:clamp(34px,9vw,52px);line-height:1.05;margin:6px 0 8px;
   transform:rotate(-2deg);text-shadow:3px 3px 0 var(--butter)}
.sub{margin:0 0 22px;font-size:18px;font-weight:800}
.glassWrap{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 26px}
.glass{position:relative;width:104px;height:150px;border:4px solid var(--ink);border-radius:8px 8px 26px 26px;background:var(--card);
  overflow:hidden;box-shadow:5px 5px 0 var(--shadow);clip-path:none}
.water{position:absolute;left:-10%;right:-10%;bottom:0;height:0%;background:linear-gradient(var(--water2),var(--water));transition:height .9s cubic-bezier(.3,1.4,.5,1)}
.water::before{content:"";position:absolute;top:-8px;left:0;right:0;height:16px;background:var(--water2);border-radius:50%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(8px) scaleY(1.2)}}
.face{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;z-index:2}
.score{text-align:left}
.score b{font-family:'Bagel Fat One';font-weight:400;font-size:46px;line-height:1;display:block}
.score small{font-size:15px;font-weight:800;display:block;max-width:160px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mood{font:inherit;font-weight:800;font-size:17px;color:#3b1f3a;border:3px solid var(--ink);border-radius:20px;padding:16px 8px 14px;cursor:pointer;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;align-items:center;gap:4px}
.mood .e{font-size:38px;line-height:1}
.mood:nth-child(1){background:var(--lilac);transform:rotate(-1.5deg)}
.mood:nth-child(2){background:var(--butter);transform:rotate(1.5deg)}
.mood:nth-child(3){background:var(--mint);transform:rotate(1deg)}
.mood:nth-child(4){background:#ffc2d6;transform:rotate(-1deg)}
.mood:nth-child(5){background:var(--water2);transform:rotate(-1deg)}
.mood:nth-child(6){background:#ffd3a8;transform:rotate(1.5deg)}
.mood:hover{transform:translate(-2px,-3px) rotate(0);box-shadow:7px 8px 0 var(--shadow)}
.mood:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
:focus-visible{outline:4px solid var(--cherry);outline-offset:3px}
.foot{margin-top:34px;font-size:15px;font-weight:800;opacity:.85}
/* modal */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(59,31,58,.55);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.scrim.on{display:flex}
.pop{background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--shadow);max-width:380px;width:100%;
  padding:26px 22px 22px;text-align:center;position:relative;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.sticker{font-size:76px;line-height:1;display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.cap{font-family:'Bagel Fat One';font-size:27px;line-height:1.1;margin:10px 0 8px;color:var(--cherry);text-transform:lowercase}
.txt{font-size:18px;line-height:1.4;margin:0 0 18px;font-weight:800}
.btn{font:inherit;font-weight:800;font-size:18px;width:100%;border:3px solid var(--ink);border-radius:999px;padding:13px 16px;cursor:pointer;
  background:var(--water);color:#1b1030;box-shadow:4px 4px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.later{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink);font:inherit;font-weight:800;font-size:15px;text-decoration:underline;cursor:pointer;opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);z-index:20;background:var(--ink);color:var(--card);
  padding:12px 18px;border-radius:999px;font-weight:800;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.conf{position:fixed;top:-40px;z-index:30;font-size:28px;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="float" id="float" aria-hidden="true"></div>
<main>
  <h1 id="title">hey cheloo 💧</h1>
  <p class="sub">how are we feeling rn?</p>

  <div class="glassWrap">
    <div class="glass" aria-hidden="true"><div class="water" id="water"></div><div class="face" id="face">🥺</div></div>
    <div class="score"><b id="count">0/8</b><small id="scoreTxt">glasses today. let’s get that glow</small></div>
  </div>

  <div class="grid" id="grid">
    <button class="mood" data-m="tired"><span class="e">😴</span>so tired</button>
    <button class="mood" data-m="stressed"><span class="e">🤯</span>stressed fr</button>
    <button class="mood" data-m="hungry"><span class="e">🍕</span>girl dinner mode</button>
    <button class="mood" data-m="miss"><span class="e">🥺</span>missing you</button>
    <button class="mood" data-m="cute"><span class="e">💅</span>feeling cute</button>
    <button class="mood" data-m="chaos"><span class="e">🤪</span>brain rot</button>
  </div>
  <p class="foot">made with love, for my favorite person 💖</p>
</main>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="cap">
  <div class="pop">
    <div class="sticker" id="stk">💧</div>
    <div class="cap" id="cap"></div>
    <p class="txt" id="txt"></p>
    <button class="btn" id="done">okay okay, sipped 🥤</button>
    <button class="later" id="later">remind me later</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ✏️ Change her name here:
const HER_NAME = "cheloo";

const DATA = {
  tired:[
    {s:"🔋",c:"battery at 2%",t:"water is the charger. plug in, ${n}. no thoughts, head empty, just sip."},
    {s:"🛌",c:"sleepy girl era",t:"even the sleepy girl era runs on hydration. one glass, then you can go back to being a blanket burrito."},
    {s:"🧋",c:"it’s giving zombie",t:"this is your sign to drink water. not coffee. not vibes. water."}
  ],
  stressed:[
    {s:"🧘‍♀️",c:"lock in. but hydrated",t:"deep breath, big sip. the situation is not that deep, ${n}, but the glass is."},
    {s:"🫧",c:"this too shall pass",t:"put the phone down, drink water, look out the window. the problem will wait. you’re doing amazing."},
    {s:"🐸",c:"it’s fine. i’m fine.",t:"you are not a robot, ${n}. take a sip, unclench your jaw, drop your shoulders. better?"}
  ],
  hungry:[
    {s:"🍝",c:"girl dinner alert",t:"sometimes hungry is secretly thirsty. water first, snacks right after. i fully support both."},
    {s:"🍟",c:"snack check",t:"quick quest: drink water, then go get the snack. you deserve the whole menu."},
    {s:"🥗",c:"fuel the main character",t:"main characters hydrate before they eat. it’s in the script."}
  ],
  miss:[
    {s:"🥺",c:"i miss you too",t:"now drink water so you stay healthy and i can annoy you for the next 60 years."},
    {s:"💌",c:"a message from your person",t:"you are the best part of my day, ${n}. now go sip. that’s an order from your favorite human."},
    {s:"🫶",c:"soft launch of love",t:"i’m not saying i think about you all day, but drink some water so i can keep doing that."}
  ],
  cute:[
    {s:"💅",c:"very demure, very mindful",t:"very hydrated, very cutesy. the glow is a water thing, ${n}. you’re welcome."},
    {s:"✨",c:"it’s giving glow",t:"it’s giving main character. it’s giving soft skin. it’s giving YOU. now sip."},
    {s:"👑",c:"slay, but make it water",t:"even queens hydrate. especially queens. one glass and you’re unstoppable."}
  ],
  chaos:[
    {s:"🧠",c:"brain rot detected",t:"treatment: one glass of water. side effects: being less chaotic (just a little bit)."},
    {s:"🎮",c:"side quest unlocked",t:"drink water. reward: +10 glow points and a very proud boyfriend."},
    {s:"🦆",c:"no thoughts, just duck",t:"quack. drink water. quack. that’s the whole message."}
  ]
};
const FACES=["🥺","😌","🙂","😊","😄","😆","🤩","😎","🥳"];
const GOAL=8;
const $=id=>document.getElementById(id);
let count=0, last={};

function key(){return "water-"+new Date().toDateString()}
try{count=parseInt(localStorage.getItem(key())||"0",10)||0}catch(e){}
function save(){try{localStorage.setItem(key(),String(count))}catch(e){}}

function render(){
  $("count").textContent=count+"/"+GOAL;
  $("water").style.height=Math.min(100,count/GOAL*100)+"%";
  $("face").textContent=FACES[Math.min(count,FACES.length-1)];
  $("scoreTxt").textContent=count===0?"glasses today. let’s get that glow":
    count>=GOAL?"GOAL HIT. you’re iconic":"glasses today. keep going cutie";
}
$("title").textContent="hey "+HER_NAME+" 💧";

// floating bubbles
const fl=$("float");
["💧","🫧","💖","🌸","💦","✨"].forEach((e,i)=>{for(let k=0;k<3;k++){
  const s=document.createElement("span");s.textContent=e;
  s.style.left=(Math.random()*95)+"%";s.style.animationDuration=(12+Math.random()*14)+"s";
  s.style.animationDelay=(-Math.random()*20)+"s";s.style.fontSize=(18+Math.random()*18)+"px";fl.appendChild(s);}});

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
function confetti(list,n){
  for(let i=0;i<n;i++){const c=document.createElement("span");c.className="conf";
    c.textContent=list[i%list.length];c.style.left=Math.random()*100+"vw";
    c.style.animationDelay=Math.random()*.5+"s";c.style.fontSize=(20+Math.random()*20)+"px";
    document.body.appendChild(c);setTimeout(()=>c.remove(),2600);}
}
let opener=null;
function openCard(m){
  const arr=DATA[m];let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===last[m]);last[m]=i;
  const d=arr[i];
  $("stk").textContent=d.s;$("cap").textContent=d.c;$("txt").textContent=d.t.replace("${n}",HER_NAME);
  $("scrim").classList.add("on");$("done").focus();
}
function closeCard(){$("scrim").classList.remove("on");if(opener)opener.focus()}
document.querySelectorAll(".mood").forEach(b=>b.addEventListener("click",()=>{opener=b;openCard(b.dataset.m)}));
$("done").addEventListener("click",()=>{
  closeCard();count++;save();render();
  if(count===GOAL){confetti(["🏆","💖","🎉","💧","👑"],40);toast("8/8 glasses?! i’m so proud of you 🥹💙");}
  else if(count>GOAL){confetti(["💧","💦"],14);toast("overachiever energy. hydrated queen 👑");}
  else{confetti(["💧","💙","🫧"],16);toast(["sip sip hooray 🥳","that’s my girl 💙","glow +10 ✨","hydration arc: unlocked 💧"][count%4]);}
});
$("later").addEventListener("click",()=>{closeCard();toast("“later” is not in my vocabulary 🙄💧");});
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeCard()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard()});
render();
</script>
</body>
</html>
